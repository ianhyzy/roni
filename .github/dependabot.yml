version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-dependencies:
        dependency-type: production
        update-types:
          - patch
    ignore:
      # AI SDK 7/Phoenix client 7 require a coordinated migration with Convex Agent.
      - dependency-name: ai
        update-types:
          - version-update:semver-major
      - dependency-name: "@ai-sdk/*"
        update-types:
          - version-update:semver-major
      - dependency-name: "@arizeai/phoenix-client"
        update-types:
          - version-update:semver-major
    reviewers:
      - JeffOtano

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
